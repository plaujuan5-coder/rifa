<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rifa Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
    }
    .numbers {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 20px 0;
      max-height: 400px;
      overflow-y: auto;
    }
    .number {
      background: #2a2a2a;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
    }
    .number.selected {
      background: purple;
    }
    .number.vendido {
      background: #444;
      cursor: not-allowed;
      opacity: 0.6;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #00c853;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>🎟️ Rifa Online</h2>
    <p>Valor por número: <b>R$10</b></p>

    <div class="numbers" id="numbers"></div>

    <button onclick="comprar()">Comprar</button>
  </div>

  <script>
    const totalNumeros = 500;

    // 👇 ACÁ BLOQUEÁS LOS PAGADOS
    const vendidos = [8,5,6,7,9];

    const contenedor = document.getElementById("numbers");
    let seleccionado = null;

    for (let i = 1; i <= totalNumeros; i++) {
      const div = document.createElement("div");
      div.textContent = i;
      div.className = "number";

      if (vendidos.includes(i)) {
        div.classList.add("vendido");
      } else {
        div.onclick = () => {
          document.querySelectorAll(".number").forEach(n => n.classList.remove("selected"));
          div.classList.add("selected");
          seleccionado = i;
        };
      }

      contenedor.appendChild(div);
    }

    function comprar() {
      if (!seleccionado) {
        alert("Elegí un número disponible");
        return;
      }

      const telefono = "5522999339777";
      const mensaje = `Hola! Quiero comprar el número ${seleccionado} de la rifa.`;
      window.open(`https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`);
    }
  </script>
</body>
</html>
