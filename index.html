<script>
const totalNumeros = 500;

// 👇 ACA BLOQUEAS LOS PAGADOS
const vendidos = [37, 102, 219];

const contenedor = document.getElementById("numbers");

for (let i = 1; i <= totalNumeros; i++) {
  const div = document.createElement("div");
  div.className = "number";
  div.textContent = i;

  if (vendidos.includes(i)) {
    div.style.background = "#444";
    div.style.cursor = "not-allowed";
  } else {
    div.onclick = () => selectNumber(div, i);
  }

  contenedor.appendChild(div);
}

let selectedNumber = null;

function selectNumber(div, number) {
  document.querySelectorAll(".number").forEach(n => n.classList.remove("selected"));
  div.classList.add("selected");
  selectedNumber = number;
}

function comprar() {
  if (!selectedNumber) {
    alert("Elegí un número disponible primero");
    return;
  }

  const telefono = "5522999339777";
  const mensaje = `Hola! Quiero comprar el número ${selectedNumber} de la rifa. Ya voy a pagar R$10.`;
  const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;

  window.open(url, "_blank");
}
</script>
